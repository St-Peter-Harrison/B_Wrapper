<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beastie Rap Practice</title>

  <style>
    :root {
      color-scheme: light;
      --ink: #172033;
      --muted: #667085;
      --panel: #f2f4f7;
      --blue: #175cd3;
      --red: #b42318;
      --green: #067647;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      max-width: 680px;
      margin: 0 auto;
      padding: 24px 18px 60px;
      color: var(--ink);
      text-align: center;
      background: #fff;
    }

    h1 {
      margin: 0 0 22px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #98a2b3;
      border-radius: 8px;
      font-size: 16px;
      margin-bottom: 12px;
    }

    button {
      padding: 13px 22px;
      border: 0;
      border-radius: 8px;
      font-size: 18px;
      font-weight: 700;
      margin: 4px;
      color: #fff;
      background: var(--blue);
    }

    button:disabled {
      opacity: 0.45;
    }

    #stopButton {
      background: #475467;
    }

    .card {
      margin-top: 20px;
      padding: 18px;
      border-radius: 12px;
      background: var(--panel);
    }

    .label {
      color: var(--muted);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    #currentName {
      min-height: 58px;
      margin-top: 6px;
      font-size: 48px;
      font-weight: 800;
    }

    #status {
      min-height: 34px;
      margin-top: 22px;
      font-size: 28px;
      font-weight: 800;
    }

    #countdown {
      min-height: 64px;
      margin: 8px 0;
      font-size: 58px;
      font-weight: 800;
    }

    #usedRhymes {
      min-height: 25px;
      margin-top: 8px;
      line-height: 1.5;
    }

    #history {
      margin-top: 24px;
      text-align: left;
    }

    #history h2 {
      margin-bottom: 10px;
    }

    .log {
      padding: 11px 12px;
      margin-bottom: 8px;
      border-left: 5px solid #98a2b3;
      border-radius: 7px;
      background: var(--panel);
      overflow-wrap: anywhere;
    }

    .log.player {
      border-left-color: var(--blue);
    }

    .log.computer {
      border-left-color: var(--green);
    }

    .log.error,
    .log.failure {
      border-left-color: var(--red);
      color: var(--red);
    }
  </style>
</head>

<body>
  <h1>Beastie Rap Practice</h1>

  <input
    id="apiKey"
    type="password"
    placeholder="Paste Mistral API key"
    autocomplete="off"
  >

  <button id="startButton">Start Round</button>
  <button id="stopButton" disabled>Stop</button>

  <section class="card" aria-live="polite">
    <div class="label">Current name</div>
    <div id="currentName">—</div>

    <div id="status">Stopped</div>
    <div id="countdown"></div>

    <div class="label">Used rhymes</div>
    <div id="usedRhymes">None</div>
  </section>

  <section id="history">
    <h2>Round history</h2>
    <div id="historyItems"></div>
  </section>

  <script src="beastie-rap-data.js"></script>
  <script>
    const WAIT_SECONDS = 4;
    const RECORD_SECONDS = 4;
    const TRANSCRIPTION_MODEL = "voxtral-mini-latest";
    const COMPLETION_MODEL = "mistral-small-latest";

    const apiKeyInput = document.getElementById("apiKey");
    const startButton = document.getElementById("startButton");
    const stopButton = document.getElementById("stopButton");
    const currentNameElement = document.getElementById("currentName");
    const statusElement = document.getElementById("status");
    const countdownElement = document.getElementById("countdown");
    const usedRhymesElement = document.getElementById("usedRhymes");
    const historyItemsElement = document.getElementById("historyItems");

    let running = false;
    let stream = null;
    let currentRecorder = null;
    let runNumber = 0;
    let currentName = null;
    let usedRhymeKeys = [];
    let usedRhymeWords = [];

    startButton.addEventListener("click", startRound);
    stopButton.addEventListener("click", stopApp);

    async function startRound() {
      const apiKey = apiKeyInput.value.trim();

      if (!apiKey) {
        alert("Paste your Mistral API key first.");
        return;
      }

      if (!window.BEASTIE_RAP_DATA) {
        alert("The rhyme data file did not load.");
        return;
      }

      try {
        stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      } catch (error) {
        alert("Could not access microphone: " + error.message);
        return;
      }

      if (!MediaRecorder.isTypeSupported("audio/webm;codecs=opus")) {
        stream.getTracks().forEach(track => track.stop());
        stream = null;
        alert("This browser cannot record WebM/Opus audio.");
        return;
      }

      running = true;
      runNumber += 1;
      const thisRun = runNumber;

      currentName = BEASTIE_RAP_DATA.pickRandomName();
      usedRhymeKeys = [];
      usedRhymeWords = [];

      currentNameElement.textContent = currentName.name;
      historyItemsElement.innerHTML = "";
      renderUsedRhymes();
      setControls(true);

      addLog("computer", "The name is " + currentName.name + ".");

      try {
        await speakText("The name is " + currentName.name + ".");
        if (!isCurrentRun(thisRun)) return;

        await speakText(
          "I met a guy and his name was " + currentName.name + "."
        );
        if (!isCurrentRun(thisRun)) return;

        await runGame(thisRun);
      } catch (error) {
        if (!isCurrentRun(thisRun)) return;
        addLog("error", "ERROR: " + error.message);
        finishRound("Technical error");
      }
    }

    async function runGame(thisRun) {
      while (isCurrentRun(thisRun)) {
        const ready = await countdown("GET READY", WAIT_SECONDS, thisRun);
        if (!ready) return;

        const audioBlob = await recordAudio(RECORD_SECONDS, thisRun);
        if (!audioBlob || !isCurrentRun(thisRun)) return;

        statusElement.textContent = "TRANSCRIBING";
        const transcript = await transcribeAudio(audioBlob);
        if (!isCurrentRun(thisRun)) return;

        if (!transcript.trim()) {
          addLog("failure", "No speech was detected.");
          finishRound("ROUND OVER");
          return;
        }

        addLog("player", "You: " + transcript);

        const choices = BEASTIE_RAP_DATA.getRhymeChoicesForName(
          currentName.name,
          usedRhymeKeys
        );

        if (choices.length === 0) {
          finishRound("YOU CLEARED THE GROUP");
          return;
        }

        statusElement.textContent = "CHOOSING RHYME";
        const playerChoice = await inferMissingRhyme(transcript, choices, thisRun);
        if (!isCurrentRun(thisRun)) return;

        if (!playerChoice) {
          addLog("failure", "No clear approved rhyme completed that sentence.");
          await speakText("No clear rhyme.");
          finishRound("ROUND OVER");
          return;
        }

        markRhymeUsed(playerChoice);
        addLog("player", "Your rhyme: " + playerChoice.word);
        await speakText(playerChoice.word);
        if (!isCurrentRun(thisRun)) return;

        const computerChoice = BEASTIE_RAP_DATA.pickRandomRhyme(
          currentName.name,
          usedRhymeKeys
        );

        if (!computerChoice) {
          finishRound("YOU CLEARED THE GROUP");
          return;
        }

        const computerWord = computerChoice.display;
        markRhymeUsed({
          key: computerChoice.key,
          word: computerWord
        });

        addLog("computer", "Computer: " + computerWord);
        statusElement.textContent = "COMPUTER TURN";

        await speakText(
          "The computer is using the word " + computerWord + "."
        );
      }
    }

    async function inferMissingRhyme(transcript, choices, thisRun) {
      const apiKey = apiKeyInput.value.trim();

      const candidateData = choices.map(choice => ({
        key: choice.key,
        spellings: choice.options
      }));

      const prompt = [
        "The player is performing an improv rhyming game.",
        "Their spoken sentence intentionally stops immediately before its final word.",
        "Choose the one allowed word that most naturally completes the sentence.",
        "Use meaning and grammar, not merely the fact that every option rhymes.",
        "If no option is a reasonably clear completion, return null values.",
        "Return JSON only in this exact shape:",
        '{"key":"exact supplied key or null","word":"exact supplied spelling or null"}',
        "",
        "Transcript:",
        transcript,
        "",
        "Allowed choices:",
        JSON.stringify(candidateData)
      ].join("\n");

      await sleep(500);
      let response;
      for (let retry = 0; retry <= 3; retry += 1) {
        if (!isCurrentRun(thisRun)) return null;
        statusElement.textContent = "CHOOSING RHYME";
        response = await fetch(
        "https://api.mistral.ai/v1/chat/completions",
        {
          method: "POST",
          headers: {
            "Authorization": "Bearer " + apiKey,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            model: COMPLETION_MODEL,
            messages: [
              {
                role: "user",
                content: prompt
              }
            ],
            response_format: {
              type: "json_object"
            },
            temperature: 0,
            max_tokens: 60
          })
        }
      );

        if (!isCurrentRun(thisRun)) return null;
        if (response.status !== 429 || retry === 3) break;
        await response.text();
        statusElement.textContent = "RATE LIMITED — RETRY " + (retry + 1) + "/3";
        await sleep(1000);
      }

      if (!response.ok) {
        const errorText = await response.text();
        throw new Error(
          "Rhyme selection failed: " + response.status + " - " + errorText
        );
      }

      const result = await response.json();
      const responseText = result.choices?.[0]?.message?.content;

      if (typeof responseText !== "string") {
        throw new Error("The rhyme model returned no usable answer.");
      }

      let parsed;

      try {
        parsed = JSON.parse(responseText);
      } catch {
        throw new Error("The rhyme model returned invalid JSON.");
      }

      if (!parsed.key && !parsed.word) {
        return null;
      }

      let choice = null;

      if (parsed.key) {
        choice = choices.find(item => item.key === parsed.key) || null;
      }

      if (!choice && parsed.word) {
        const returnedKey = BEASTIE_RAP_DATA.getRhymeKey(parsed.word);
        choice = choices.find(item => item.key === returnedKey) || null;
      }

      if (!choice) {
        return null;
      }

      const exactSpelling = choice.options.find(option => {
        return normalize(option) === normalize(parsed.word);
      });

      return {
        key: choice.key,
        word: exactSpelling || choice.display
      };
    }

    async function transcribeAudio(audioBlob) {
      const apiKey = apiKeyInput.value.trim();
      const formData = new FormData();

      formData.append("model", TRANSCRIPTION_MODEL);
      formData.append("language", "en");
      formData.append("file", audioBlob, "recording.webm");

      const response = await fetch(
        "https://api.mistral.ai/v1/audio/transcriptions",
        {
          method: "POST",
          headers: {
            "Authorization": "Bearer " + apiKey
          },
          body: formData
        }
      );

      if (!response.ok) {
        const errorText = await response.text();
        throw new Error(
          "Transcription failed: " + response.status + " - " + errorText
        );
      }

      const result = await response.json();
      return String(result.text ?? "");
    }

    function recordAudio(seconds, thisRun) {
      return new Promise(resolve => {
        const chunks = [];
        let displayTimer = null;
        let stopTimer = null;

        const recorder = new MediaRecorder(stream, {
          mimeType: "audio/webm;codecs=opus"
        });

        currentRecorder = recorder;

        recorder.ondataavailable = event => {
          if (event.data.size > 0) {
            chunks.push(event.data);
          }
        };

        recorder.onstop = () => {
          clearInterval(displayTimer);
          clearTimeout(stopTimer);
          countdownElement.textContent = "";

          if (currentRecorder === recorder) {
            currentRecorder = null;
          }

          if (chunks.length === 0) {
            resolve(null);
            return;
          }

          resolve(new Blob(chunks, { type: "audio/webm" }));
        };

        recorder.onerror = event => {
          clearInterval(displayTimer);
          clearTimeout(stopTimer);
          currentRecorder = null;
          resolve(null);
          addLog(
            "error",
            "Recording error: " + (event.error?.message || "Unknown error")
          );
        };

        recorder.start();
        statusElement.textContent = "RECORDING";

        let remaining = seconds;
        countdownElement.textContent = remaining;

        displayTimer = setInterval(() => {
          remaining -= 1;

          if (remaining > 0) {
            countdownElement.textContent = remaining;
          }
        }, 1000);

        stopTimer = setTimeout(() => {
          if (
            isCurrentRun(thisRun) &&
            recorder.state === "recording"
          ) {
            recorder.stop();
          }
        }, seconds * 1000);
      });
    }

    async function countdown(label, seconds, thisRun) {
      statusElement.textContent = label;

      for (let remaining = seconds; remaining > 0; remaining -= 1) {
        if (!isCurrentRun(thisRun)) {
          return false;
        }

        countdownElement.textContent = remaining;
        await sleep(1000);
      }

      countdownElement.textContent = "";
      return isCurrentRun(thisRun);
    }

    function markRhymeUsed(choice) {
      if (!usedRhymeKeys.includes(choice.key)) {
        usedRhymeKeys.push(choice.key);
        usedRhymeWords.push(choice.word);
        renderUsedRhymes();
      }
    }

    function renderUsedRhymes() {
      usedRhymesElement.textContent = usedRhymeWords.length
        ? usedRhymeWords.join(", ")
        : "None";
    }

    function addLog(type, text) {
      const div = document.createElement("div");
      div.className = "log " + type;
      div.textContent = text;
      historyItemsElement.appendChild(div);
      div.scrollIntoView({ behavior: "smooth", block: "nearest" });
    }

    function finishRound(message) {
      running = false;
      runNumber += 1;

      if (currentRecorder?.state === "recording") {
        currentRecorder.stop();
      }

      if (stream) {
        stream.getTracks().forEach(track => track.stop());
        stream = null;
      }

      statusElement.textContent = message;
      countdownElement.textContent = "";
      setControls(false);
    }

    function stopApp() {
      running = false;
      runNumber += 1;
      window.speechSynthesis?.cancel();

      if (currentRecorder?.state === "recording") {
        currentRecorder.stop();
      }

      if (stream) {
        stream.getTracks().forEach(track => track.stop());
        stream = null;
      }

      statusElement.textContent = "Stopped";
      countdownElement.textContent = "";
      setControls(false);
    }

    function setControls(isRunning) {
      startButton.disabled = isRunning;
      stopButton.disabled = !isRunning;
    }

    function isCurrentRun(thisRun) {
      return running && thisRun === runNumber;
    }

    function speakText(text) {
      return new Promise(resolve => {
        if (!("speechSynthesis" in window)) {
          resolve();
          return;
        }

        const utterance = new SpeechSynthesisUtterance(text);
        let finished = false;

        const finish = () => {
          if (finished) return;
          finished = true;
          clearTimeout(fallbackTimer);
          resolve();
        };

        utterance.rate = 1;
        utterance.onend = finish;
        utterance.onerror = finish;

        const fallbackTimer = setTimeout(
          finish,
          Math.max(3000, text.length * 120)
        );

        window.speechSynthesis.speak(utterance);
      });
    }

    function normalize(value) {
      return String(value ?? "")
        .trim()
        .replace(/[‘’]/g, "'")
        .toLowerCase();
    }

    function sleep(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }
  </script>
</body>
</html>
